# =============================================================================
# SunlightCity — PostgreSQL configuration for the BULK LOAD phase
#
# Include from postgresql.conf:
#     include = 'postgresql.bulk.conf'
# or start the container with:
#     postgres -c config_file=/etc/postgresql/postgresql.conf
#
# ⚠  READ THIS FIRST
# ------------------
# This profile deliberately trades crash durability for write throughput. It is
# correct ONLY because of a property of this specific workload: every byte it
# writes is REPRODUCIBLE. The input is a deterministic function of (city mesh,
# solar ephemeris, shard, date), the work queue records exactly which tasks
# completed, and any lost task is simply re-run. Losing the database to a power
# cut costs wall-clock time, not information.
#
# Do NOT leave this profile on for a database serving queries you care about.
# Switch to postgresql.serving.conf after the load — see TUNING.md.
#
# Baseline assumption for the numbers below: a dedicated 16 vCPU / 64 GB RAM
# node with NVMe storage. pg_tune.py generates a profile for your actual host;
# these are the documented reference values.
# =============================================================================


# -----------------------------------------------------------------------------
# 1. WAL — the single biggest lever, and the one most often tuned backwards.
# -----------------------------------------------------------------------------
#
# A note on "decrease WAL size", which is the intuitive but wrong instinct:
# shrinking max_wal_size does NOT reduce WAL work. It makes checkpoints fire more
# often, and each checkpoint forces dirty buffers to disk *and* re-arms
# full-page-image logging for every subsequently touched page. Under a sustained
# bulk load, a small max_wal_size produces a checkpoint storm that can cost more
# than the WAL writes themselves.
#
# The correct decomposition is two separate goals:
#   (a) reduce the VOLUME of WAL generated per row   -> wal_level = minimal
#   (b) raise the CEILING so checkpoints stay rare   -> large max_wal_size
# They pull in opposite directions on the same knob only if you conflate them.

wal_level = minimal
# 'minimal' unlocks the optimisation this pipeline is built around: COPY into a
# relation created or truncated in the SAME transaction skips WAL entirely. The
# worker exploits this by staging into a fresh per-task table, so the bulk of the
# data is never WAL-logged at all.
# Cost: no streaming replication, no PITR, no standby. Acceptable here — see the
# reproducibility argument above.

max_wal_senders = 0
# Required: PostgreSQL refuses wal_level = minimal unless this is 0.

max_wal_size = 64GB
# Deliberately huge. At ~50 concurrent COPY streams the instantaneous WAL rate is
# high; this keeps checkpoints to roughly one per 15 minutes instead of one every
# few seconds. Costs disk space in pg_wal, nothing else.

min_wal_size = 8GB
# Keeps recycled segments preallocated so a burst never waits on file creation.

checkpoint_timeout = 30min
# Fewer, larger checkpoints. Combined with the completion target below this
# spreads the flush out rather than stalling the fleet.

checkpoint_completion_target = 0.9
# Spread checkpoint writes over 90% of the interval — smooths the I/O spike that
# would otherwise stall every COPY simultaneously.

checkpoint_flush_after = 2MB
# Hint the kernel to start writeback incrementally instead of dumping the whole
# dirty set at fsync time.

wal_compression = off
# WAL volume is already near-zero thanks to wal_level=minimal, so compression
# would spend CPU we want for raycast-adjacent work. Turn ON instead if you must
# keep wal_level=replica.

wal_buffers = 128MB
# Default (-1) derives 1/32 of shared_buffers, capped at 16MB — far too small for
# 50 concurrent writers. Sized to hold several seconds of WAL so backends never
# block waiting for a buffer flush.

wal_writer_delay = 200ms
wal_writer_flush_after = 16MB
# Batch WAL flushes more aggressively; safe given synchronous_commit is off.


# -----------------------------------------------------------------------------
# 2. Durability — the aggressive section. Each line states what it costs.
# -----------------------------------------------------------------------------

synchronous_commit = off
# Commits return without waiting for WAL fsync. This is the highest-value single
# setting for many small transactions (our heartbeats and task state updates) and
# it is nearly free in risk terms: a crash loses at most the last
# wal_writer_delay window of COMMITTED transactions. The database stays
# STRUCTURALLY consistent — this is not fsync=off. Lost task completions simply
# re-run.

full_page_writes = off
# ⚠ HIGHEST-RISK SETTING IN THIS FILE.
# Skips writing a full page image on first modification after a checkpoint.
# Saves substantial WAL volume and CPU. The risk it removes protection from is a
# TORN PAGE: if the OS crashes mid-8KB-write, the page is left half-old/half-new
# and recovery cannot repair it -> corrupt relation, not just lost rows.
#
# Safe to disable ONLY if one of these holds:
#   * ZFS / btrfs with copy-on-write (writes are atomic by construction), or
#   * a storage stack guaranteeing 8 KB atomic writes (many NVMe drives, most
#     enterprise arrays with battery-backed cache), or
#   * you accept "restore from dump / re-run the pipeline" as the recovery plan.
# If none apply, set this back to `on`. pg_tune.py leaves it `on` unless
# explicitly forced, precisely because it cannot detect the above.

fsync = on
# NOT disabled, on purpose. fsync=off risks unrecoverable corruption from a
# single power loss and buys little once synchronous_commit=off and
# full_page_writes=off have removed the frequent-fsync paths. This is the line
# where "aggressive" stops being a good trade.


# -----------------------------------------------------------------------------
# 3. Memory
# -----------------------------------------------------------------------------

shared_buffers = 16GB
# 25% of 64 GB. Larger is NOT better for a write-heavy bulk load: PostgreSQL
# still relies on the OS page cache, and an oversized buffer pool lengthens
# checkpoint scans and increases the dirty set each checkpoint must flush.

effective_cache_size = 48GB
# Planner hint only (never allocated). 75% of RAM tells the planner index scans
# are cheap, which matters for the reduce phase's aggregate queries.

work_mem = 256MB
# Per sort/hash NODE, not per query — a single query with several hash joins can
# use a multiple of this. 256MB x ~64 concurrent operations is a worst case of
# ~16 GB, which fits alongside shared_buffers on a 64 GB box. Sized generously
# because the reduce phase's GROUP BY over edge sums must stay in memory; a spill
# to disk there is the difference between minutes and hours.

maintenance_work_mem = 4GB
# Used by CREATE INDEX and VACUUM. The post-load index build is a single large
# sort — this is the setting that decides whether it fits in RAM. The largest
# single lever on 04_post_load_indexes.sql runtime.

max_parallel_maintenance_workers = 8
# Parallel B-tree build for the post-load indexes.

autovacuum_work_mem = 1GB
# Kept separate from maintenance_work_mem so an autovacuum can't claim 4 GB.

huge_pages = try
# Reduces TLB pressure for a 16 GB buffer pool. 'try' so startup still succeeds
# if the host has no hugepages reserved.


# -----------------------------------------------------------------------------
# 4. Concurrency — sized for the fleet
# -----------------------------------------------------------------------------

max_connections = 200
# 50 workers x (1 COPY + 1 control connection) = 100, plus orchestrator, monitor
# and headroom. Note PgBouncer fronts this in the shipped deployment, so backend
# connections stay well below the limit even if the fleet is scaled up.

superuser_reserved_connections = 5
# Guarantees an operator can always get in to diagnose a saturated fleet.

max_worker_processes = 16
max_parallel_workers = 16
max_parallel_workers_per_gather = 4
# Parallel query matters for the reduce phase, not the map phase (COPY is not
# parallelised server-side). Capped per-gather so one reduce query cannot consume
# every worker slot and stall the others.


# -----------------------------------------------------------------------------
# 5. Autovacuum — throttled during load, NOT disabled
# -----------------------------------------------------------------------------
autovacuum = on
# Deliberately left ON. Disabling it entirely is a common bulk-load recipe and a
# trap: the work queue (meo_tasks) is a high-churn table receiving several
# UPDATEs per task, so it bloats fast and its partial indexes degrade. What we
# want is autovacuum that IGNORES the giant append-only partitions and stays
# attentive to the small hot tables.

autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_cost_delay = 0
# No throttling: on NVMe there is no reason to rate-limit vacuum, and a throttled
# vacuum cannot keep up with the queue's churn.

autovacuum_vacuum_scale_factor = 0.2
autovacuum_analyze_scale_factor = 0.1
# Global defaults. Per-table overrides for the append-only partitions and the hot
# queue table are applied in 03_bulk_load_tuning.sql, which is where they belong
# (they are table properties, not server properties).


# -----------------------------------------------------------------------------
# 6. Planner / storage
# -----------------------------------------------------------------------------
random_page_cost = 1.1
# NVMe: random reads cost essentially the same as sequential. The default 4.0
# describes spinning rust and pushes the planner to seq-scan 100M-row partitions
# when an index scan is correct.

effective_io_concurrency = 200
# NVMe queue depth, for bitmap heap scan prefetching.

default_statistics_target = 100
# Raised to 500 on the partitioned exposure tables in 04, where the planner needs
# good selectivity estimates on `datetime`.

temp_buffers = 64MB
# Per-session, for the worker's staging tables.


# -----------------------------------------------------------------------------
# 7. Observability — non-negotiable when 50 pods write concurrently
# -----------------------------------------------------------------------------
log_min_duration_statement = 5000
# Log anything over 5 s. A COPY that suddenly takes 5x longer is the first sign of
# lock contention or a checkpoint stall.

log_checkpoints = on
# Essential: correlates throughput dips with checkpoint activity. If the fleet
# stalls periodically, this log tells you immediately whether checkpoints are why.

log_lock_waits = on
deadlock_timeout = 1s
# Surfaces relation-extension and tuple-lock contention — exactly the failure
# mode partitioning is meant to prevent, so we want to know if it reappears.

log_autovacuum_min_duration = 10000
log_temp_files = 10485760          # 10 MB — flags work_mem spills
log_line_prefix = '%m [%p] %q%u@%d/%a '
track_io_timing = on
# Makes pg_stat_statements and EXPLAIN report real I/O time.

shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
