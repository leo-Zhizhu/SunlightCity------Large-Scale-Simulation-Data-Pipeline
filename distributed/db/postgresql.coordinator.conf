# =============================================================================
# SunlightCity — COORDINATOR
#
# Reference hardware: 8 vCPU / 32 GB. One instance.
#
#   python distributed/orchestrator/pg_tune.py --role coordinator \
#          --ram-gb 32 --cpus 8 --workers 50
#
# Include from postgresql.conf:   include = 'postgresql.coordinator.conf'
#
# ONE profile, not two. The coordinator's workload does not change between phases:
# during the map phase it serves the work queue, afterwards it serves the routing
# lookup and the analytics federation. Both are small, latency-sensitive and
# read-mostly. There is nothing to trade away for bulk throughput, because no bulk
# ever lands here.
#
#
# WHY THIS INSTANCE EXISTS SEPARATELY
# -----------------------------------
# It holds ~200 MB: the work queue, the section/shard topology, and the
# authoritative static geometry. It could physically fit on any shard. Keeping it
# apart is the point:
#
#   meo_tasks is ~6,000 rows taking ~250,000 UPDATEs over a run (one claim, ~40
#   heartbeats and one completion per task) and every one of them is on a worker's
#   critical path. The exposure leaves are 500 GB of append-only bulk. Co-locate
#   them and every claim queues behind a checkpoint flushing a bulk load's dirty
#   buffers — so claim latency degrades exactly when the fleet is busiest, which
#   is the failure mode hardest to diagnose from the outside.
#
# Separate instance, separate page cache, separate WAL, separate checkpointer. The
# control plane's latency becomes independent of the data plane's throughput.
#
#
# DURABILITY IS NOT TRADED AWAY HERE
# ----------------------------------
# The shards run synchronous_commit = off during the load because their contents
# are reproducible. The coordinator's are NOT: meo_tasks IS the record of what has
# been computed. Lose the last 200 ms of it and the fleet re-runs tasks that
# already succeeded — or worse, a task marked done that was rolled back leaves a
# gap the completeness check will find only at the end.
#
# So this instance keeps full durability. It costs nothing worth measuring: the
# whole write volume is a few hundred thousand tiny HOT updates.
# =============================================================================

# ---- Memory -----------------------------------------------------------------
# 25% of 32 GB. The entire working set is a few hundred megabytes, so this is
# already many times what is needed — sized for headroom, not for the data.
shared_buffers = 8GB
effective_cache_size = 24GB

# Modest and deliberate. The queries here are single-row lookups and small
# aggregates over 6,000 rows. The one exception is the analytics federation, where
# partitionwise aggregate means each shard returns a handful of rows rather than
# millions — so even that needs little.
work_mem = 32MB

maintenance_work_mem = 1GB
max_parallel_maintenance_workers = 2
autovacuum_work_mem = 256MB
temp_buffers = 16MB
huge_pages = try

# ---- WAL --------------------------------------------------------------------
# replica throughout, unlike the shards. See the header: the queue is the record
# of what has been computed, and it is not reproducible from anything else.
wal_level = replica
max_wal_senders = 5
max_replication_slots = 5

# Small. The write volume is tiny, so frequent checkpoints cost nothing and keep
# crash recovery near-instant — which is what you want from the instance the whole
# fleet depends on.
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_timeout = 10min
checkpoint_completion_target = 0.9
wal_compression = on
wal_buffers = 16MB

# ---- Durability -------------------------------------------------------------
synchronous_commit = on
full_page_writes = on
fsync = on

# ---- Concurrency ------------------------------------------------------------
# 50 workers reach this through PgBouncer in transaction mode, so actual backends
# stay near 25. The ceiling accommodates a pooler restart, the orchestrator, and
# ad-hoc sessions without refusing anyone.
max_connections = 200
superuser_reserved_connections = 5
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 2

# ---- Autovacuum -------------------------------------------------------------
# The most aggressive settings in the whole deployment, and they belong here.
#
# meo_tasks turns over ~42 row versions per task. Left to defaults it bloats within
# minutes, its partial indexes degrade, and claim latency — which every one of the
# 50 workers waits on — becomes visible. fillfactor = 70 in
# 04_bulk_load_tuning.sql lets most of those updates be HOT (in place, no index
# write); autovacuum keeps up with the rest.
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 15s
# No throttling. There is no bulk load here to protect from vacuum I/O — which is
# precisely the benefit of having separated the two.
autovacuum_vacuum_cost_delay = 0

# ---- Planner / IO -----------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# ---- Federation (postgres_fdw) ----------------------------------------------
# Also pinned at database scope by 06_serving_federation.sql, because a client
# connecting without them silently reads the ten shards serially — which presents
# as "the federation is slow", not as a misconfiguration.
#
# async_append: foreign scans under an Append run CONCURRENTLY, so a whole-network
#   query costs the max over shards rather than the sum.
# partitionwise_aggregate: pushes count/sum INTO each shard, so ten rows cross the
#   network instead of ten million. (The two never apply to the same plan node —
#   see the note in 06_serving_federation.sql.)
enable_async_append = on
enable_partitionwise_aggregate = on
enable_partitionwise_join = on
enable_partition_pruning = on

# JIT off: every query here is short and repetitive, and compilation would cost
# more than execution.
jit = off

# ---- Observability ----------------------------------------------------------
log_checkpoints = on
log_lock_waits = on
deadlock_timeout = 1s
# Tight. A claim taking over 200 ms means 50 workers are each waiting that long,
# and it is the single most valuable warning this instance can emit.
log_min_duration_statement = 200
log_temp_files = 10485760
log_autovacuum_min_duration = 5000
log_line_prefix = '%m [%p] %q%u@%d/%a '
track_io_timing = on
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = all
