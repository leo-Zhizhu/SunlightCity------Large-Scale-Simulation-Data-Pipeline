# =============================================================================
# SunlightCity — PostgreSQL configuration for the SERVING phase
#
# Switch to this AFTER the bulk load completes and 04_post_load_indexes.sql has
# run. It restores durability and replication, and re-tunes memory for a
# read-mostly query workload instead of a write-saturated one.
#
# Requires a RESTART (not just a reload): wal_level and full_page_writes are
# postmaster-level settings.
#
# The two profiles exist because the right answer genuinely inverts between the
# phases. During the load, WAL is pure overhead on reproducible data. Once the
# data is expensive to regenerate and someone is querying it, WAL is how you
# avoid regenerating it.
# =============================================================================


# -----------------------------------------------------------------------------
# 1. Durability restored
# -----------------------------------------------------------------------------
wal_level = replica
# Re-enables streaming replication and PITR. You cannot take a valid base backup
# under wal_level=minimal, so this must be flipped before the dataset is
# considered protected.

max_wal_senders = 10
max_replication_slots = 10

synchronous_commit = on
# Back to durable commits.

full_page_writes = on
# Torn-page protection restored. Non-negotiable for data you are not prepared to
# regenerate.

fsync = on

max_wal_size = 4GB
min_wal_size = 1GB
# Far smaller than the load profile: write volume is now low, and a smaller
# ceiling means faster crash recovery and less pg_wal disk.

checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_compression = on
# Now worth the CPU — WAL volume is low and compression reduces both disk and
# replication bandwidth.


# -----------------------------------------------------------------------------
# 2. Memory re-tuned for reads
# -----------------------------------------------------------------------------
shared_buffers = 16GB
effective_cache_size = 48GB

work_mem = 64MB
# Reduced 4x from the load profile. During the load a handful of huge sorts ran;
# now many concurrent routing queries run, and work_mem is per sort NODE per
# query. Leaving it at 256MB risks OOM once concurrency rises.

maintenance_work_mem = 2GB
# Lower: no more giant index builds expected, and this memory is better left to
# the OS page cache.

huge_pages = try


# -----------------------------------------------------------------------------
# 3. Concurrency for query serving
# -----------------------------------------------------------------------------
max_connections = 200
superuser_reserved_connections = 5

max_worker_processes = 16
max_parallel_workers = 16
max_parallel_workers_per_gather = 4


# -----------------------------------------------------------------------------
# 4. Autovacuum back to normal
# -----------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 60s
autovacuum_vacuum_cost_delay = 2ms
# Gentle throttling restored so vacuum cannot starve foreground queries.
autovacuum_vacuum_scale_factor = 0.2
autovacuum_analyze_scale_factor = 0.1

# NOTE: the per-table overrides from 03_bulk_load_tuning.sql persist across this
# switch — they are stored in pg_class.reloptions, not in postgresql.conf. The
# append-only partitions keep their effectively-disabled vacuum threshold, which
# remains correct: they are still append-only. Reset explicitly if that changes:
#   ALTER TABLE <part> RESET (autovacuum_vacuum_threshold,
#                             autovacuum_vacuum_scale_factor);


# -----------------------------------------------------------------------------
# 5. Planner
# -----------------------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# Partition pruning matters much more now that queries are selective.
enable_partition_pruning = on
enable_partitionwise_join = on
enable_partitionwise_aggregate = on
# Both partitionwise options default OFF because they increase planning time.
# Worth enabling here: the rollup and analytics queries group by edge across
# monthly partitions, which is exactly the shape they optimise.


# -----------------------------------------------------------------------------
# 6. Observability
# -----------------------------------------------------------------------------
log_min_duration_statement = 1000
# Tighter than the load profile: a 1 s routing query is already too slow.
log_checkpoints = on
log_lock_waits = on
log_temp_files = 10485760
log_line_prefix = '%m [%p] %q%u@%d/%a '
track_io_timing = on

shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
