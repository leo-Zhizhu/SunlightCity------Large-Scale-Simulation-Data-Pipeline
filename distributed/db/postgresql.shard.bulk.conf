# =============================================================================
# SunlightCity — DATA SHARD, BULK profile
#
# Reference hardware: 16 vCPU / 128 GB / local NVMe. One of ten identical
# instances. Regenerate for your own hardware:
#
#   python distributed/orchestrator/pg_tune.py --role shard --profile bulk \
#          --ram-gb 128 --cpus 16 --workers 54 --shards 9
#
# Include from postgresql.conf:   include = 'postgresql.shard.bulk.conf'
#
# wal_level, shared_buffers, huge_pages, max_wal_senders and
# shared_preload_libraries all require a RESTART, not a reload.
#
#
# WHAT THIS INSTANCE IS DOING
# ---------------------------
# Absorbing ~56 GB of exposure samples — 876 million rows — from six workers
# holding two COPY connections each. Twelve concurrent streams, nothing else —
# exactly the number a 16 vCPU instance sustains before COPY stops scaling (B5),
# which is why the fleet was sized at six workers per shard and not seven.
#
# THE SINGLE MOST IMPORTANT LINE IN THIS FILE IS `wal_level = minimal`.
#
# Every task builds its own partition leaf from scratch and COPYs into it inside
# the same transaction, then ATTACHes it. PostgreSQL skips WAL entirely for a COPY
# into a relation created in the current transaction — so under this profile the
# whole ~500 GB dataset is written across the cluster WITHOUT A SINGLE WAL RECORD
# for the sample data. Not reduced: skipped.
#
# Verify it rather than trusting it:
#     SELECT pg_current_wal_lsn();   -- before one task
#     SELECT pg_current_wal_lsn();   -- after
# The delta should be kilobytes (the catalog entries for CREATE and ATTACH), not
# the ~18 MB the task actually wrote.
#
#
# THE SAFETY ARGUMENT, STATED PLAINLY
# -----------------------------------
# This profile trades crash durability for throughput. That is legitimate ONLY
# because of a property of this specific workload:
#
#   Every byte is REPRODUCIBLE. The output is a deterministic function of (city
#   mesh, solar ephemeris, section, date, window); the coordinator's work queue
#   records exactly which tasks completed; a lost task simply re-runs. Losing a
#   shard to a power cut costs wall-clock time, not information.
#
# Apply this profile to a database where that is not true and you are simply
# running an unsafe database. Switch to postgresql.shard.serving.conf before
# anyone depends on the data. See docs/TUNING.md.
# =============================================================================

# ---- Memory -----------------------------------------------------------------
# 25% of RAM, capped at 16 GB. Larger is NOT better for a write-heavy load:
# PostgreSQL still leans on the OS page cache, and an oversized buffer pool
# lengthens every checkpoint's scan and enlarges its dirty set.
shared_buffers = 16GB

# The rest of the machine is page cache, and on this instance that matters more
# than usual: the shard's whole 56 GB of data fits in it many times over, so the
# reduce phase's aggregate reads from memory rather than disk.
effective_cache_size = 96GB

# work_mem is PER SORT/HASH NODE, not per query and not per connection. Ten COPY
# streams need almost none; the reduce phase's GROUP BY over 876M rows needs a
# lot. 256 MB x ~24 concurrent nodes worst case = ~6 GB against 128 GB of RAM.
work_mem = 256MB

# The single largest lever on post-load index build time. Generous because during
# the load nothing else wants it, and the reduce phase is latency-critical.
maintenance_work_mem = 16GB
max_parallel_maintenance_workers = 8

autovacuum_work_mem = 2GB
temp_buffers = 64MB

# A 16 GB buffer pool addressed through 4 KB pages needs 4M page-table entries;
# 2 MB huge pages cut that to 8,192 and keep the TLB effective. `try` rather than
# `on` so the instance still starts if the host has none reserved — but reserve
# them (vm.nr_hugepages) and check `SHOW huge_pages_status` says 'on'.
huge_pages = try

# ---- WAL --------------------------------------------------------------------
# See the header. This is what makes the load WAL-free.
wal_level = minimal
max_wal_senders = 0          # required by wal_level = minimal

# RAISED, not lowered — this is the setting most often tuned backwards.
#
# Shrinking max_wal_size does not reduce WAL work. It makes checkpoints fire more
# often, and each checkpoint both forces every dirty buffer to disk (stalling
# every writer at once) and re-arms full-page-image logging for every page touched
# afterwards. Under sustained bulk load a small max_wal_size produces a checkpoint
# storm that costs far more than the WAL writes it was meant to avoid.
#
# The two goals only conflict if you put them on one knob:
#     reduce WAL VOLUME per row  ->  wal_level = minimal   (a different knob)
#     keep checkpoints RARE      ->  max_wal_size          (raise this one)
#
# Scaled from the streams arriving at THIS instance (twelve, not fifty-four) rather than
# from the fleet size, because concurrent writers here set the instantaneous WAL
# rate. The sample load emits almost none — the leaves are created in the same
# transaction as their COPY — so what this actually has to absorb is the reduce
# phase's edge rollup, a fully-logged INSERT of ~16.1M rows, plus its indexes.
#
# pg_tune.py reproduces this exactly:
#   python pg_tune.py --role shard --profile bulk --ram-gb 128 --cpus 16 \
#          --workers 54 --shards 9
max_wal_size = 36GB
min_wal_size = 4GB
checkpoint_timeout = 30min
checkpoint_completion_target = 0.9
checkpoint_flush_after = 2MB

# Compression off: it trades CPU for WAL bytes, and on this profile there are
# barely any WAL bytes to save while every core is wanted for COPY.
wal_compression = off
wal_buffers = 144MB
wal_writer_delay = 200ms
wal_writer_flush_after = 16MB

# ---- Durability -------------------------------------------------------------
# A crash loses the last ~200 ms of committed transactions. Structurally
# consistent — this is not fsync=off — and a lost task completion simply means the
# lease expires and the task re-runs. Highest value per unit of risk in the file.
synchronous_commit = off

# LEFT ON, deliberately. Turning it off skips writing a full page image on the
# first modification after a checkpoint, saving real WAL and CPU — but the
# protection it removes is against a TORN PAGE, and a torn page is not a lost row,
# it is a CORRUPT RELATION that recovery cannot repair.
#
# Safe to disable only on ZFS/btrfs (copy-on-write makes writes atomic by
# construction) or storage guaranteeing atomic 8 KB writes. pg_tune.py will not
# emit `off` unless asked with --unsafe-torn-pages, because it cannot detect
# either condition.
full_page_writes = on

# Not disabled. This is where "aggressive" stops being a good trade: a single
# power loss risks corruption beyond repair, and it buys little once
# synchronous_commit is already off.
fsync = on

# ---- Concurrency ------------------------------------------------------------
# Ten COPY streams + the reduce session + monitoring. No pooler in front of this
# instance during the load — deliberately, because a transaction pooler in a
# sustained bulk byte path is a single-threaded proxy relaying hundreds of MB/s.
# Sharding already keeps the backend count low enough not to need one.
max_connections = 100
superuser_reserved_connections = 5
max_worker_processes = 16
max_parallel_workers = 16
max_parallel_workers_per_gather = 4

# ---- Autovacuum -------------------------------------------------------------
# ON, but held away from the exposure leaves by per-table settings in
# 04_bulk_load_tuning.sql. Switching it off server-wide is a common bulk-load
# recipe and the wrong move: it would also stop the statistics the reduce phase
# depends on.
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
# No throttling: local NVMe, and nothing else is competing for its I/O.
autovacuum_vacuum_cost_delay = 0

# ---- Planner / IO -----------------------------------------------------------
random_page_cost = 1.1              # NVMe: a random page costs ~a sequential one
effective_io_concurrency = 200
default_statistics_target = 100
enable_partitionwise_aggregate = on
enable_partitionwise_join = on
# 3,360 leaves per shard. Pruning is what replaces an index on the sample table, so
# it is not optional here.
enable_partition_pruning = on

# ---- Observability ----------------------------------------------------------
# log_checkpoints exists for one specific diagnosis: if the fleet stalls
# periodically, this tells you immediately whether checkpoints are why.
log_checkpoints = on
log_lock_waits = on
# Waits on the 'extend' lock would mean the one-leaf-per-task design is not
# actually isolating writers — the first thing to check if ingest is below spec.
deadlock_timeout = 1s
log_min_duration_statement = 5000
log_temp_files = 10485760           # any spill over 10 MB: raise work_mem
log_autovacuum_min_duration = 10000
log_line_prefix = '%m [%p] %q%u@%d/%a '
track_io_timing = on
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
