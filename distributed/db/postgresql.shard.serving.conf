# =============================================================================
# SunlightCity — DATA SHARD, SERVING profile
#
# Reference hardware: 16 vCPU / 128 GB / local NVMe.
#
#   python distributed/orchestrator/pg_tune.py --role shard --profile serving \
#          --ram-gb 128 --cpus 16
#
# Switch to this AFTER the reduce phase, then restart, then take a base backup —
# the bulk profile could not produce one.
#
#
# WHY THE RIGHT ANSWER INVERTS BETWEEN THE PHASES
# -----------------------------------------------
# During the load, WAL is pure overhead on data that is reproducible from (mesh,
# ephemeris, section, date, window) in about three minutes.
#
# Once the data is loaded and something is querying it, that reasoning ends. Not
# because regenerating became impossible, but because the dataset is now the
# input to something else, and "restore from a replica" is seconds while "re-run
# the pipeline" is a cluster and a Unity licence. WAL is how you avoid needing
# either.
#
# So: replication on, synchronous commit on, checkpoints more frequent and
# smaller, memory rebalanced from a few enormous sorts toward many concurrent
# small ones.
#
# Per-table settings from 04_bulk_load_tuning.sql PERSIST across this switch —
# they live in pg_class.reloptions, not here. That is correct: the exposure leaves
# are still append-only and still want fillfactor 100.
# =============================================================================

# ---- Memory -----------------------------------------------------------------
shared_buffers = 16GB

# This shard's ~10 GB of samples plus its ~200 MB of edge rollup fit in the page
# cache with room to spare, which is the point of a 128 GB instance holding a
# tenth of the dataset: after a warm-up pass, routing queries never touch disk.
effective_cache_size = 96GB

# Reduced 4x from bulk. The workload changed shape completely: many concurrent
# routing queries each doing small lookups, instead of a handful of enormous
# aggregates. 64 MB x ~48 concurrent sort nodes = ~3 GB worst case.
work_mem = 64MB

maintenance_work_mem = 2GB
max_parallel_maintenance_workers = 4
autovacuum_work_mem = 512MB
temp_buffers = 16MB
huge_pages = try

# ---- WAL --------------------------------------------------------------------
# replica, not minimal: streaming replication, PITR and a valid base backup all
# become possible. This is the whole reason to switch profiles.
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10

# Lowered from 24 GB. Recovery time after a crash is bounded by how much WAL must
# be replayed, and now that matters more than bulk write throughput. Smaller and
# more frequent checkpoints trade a little steady-state I/O for a much shorter
# recovery.
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
checkpoint_flush_after = 2MB

# On now: the WAL is being shipped to a replica, so CPU spent compressing it buys
# network and archive bandwidth.
wal_compression = on
wal_buffers = 64MB

# ---- Durability -------------------------------------------------------------
synchronous_commit = on
full_page_writes = on
fsync = on

# ---- Concurrency ------------------------------------------------------------
# Higher than bulk: the serving path IS fronted by PgBouncer, but the ceiling must
# still accommodate direct analytic sessions and the coordinator's postgres_fdw
# connections.
max_connections = 300
superuser_reserved_connections = 5
max_worker_processes = 16
max_parallel_workers = 16
max_parallel_workers_per_gather = 4

# ---- Autovacuum -------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 60s
# Throttled now, unlike bulk: there is live query traffic to avoid disturbing.
autovacuum_vacuum_cost_delay = 2ms

# ---- Planner / IO -----------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100
enable_partitionwise_aggregate = on
enable_partitionwise_join = on
enable_partition_pruning = on

# JIT off. Routing queries are short and highly repetitive; JIT compilation would
# add several milliseconds of setup to a query that runs in one, and PostgreSQL's
# cost-based trigger misjudges that on partitioned tables (it sums the estimated
# cost across partitions, so a pruned query can still look expensive enough to
# trigger it).
jit = off

# ---- Observability ----------------------------------------------------------
log_checkpoints = on
log_lock_waits = on
deadlock_timeout = 1s
# Tighter than bulk: a 1 s routing query is a bug worth seeing.
log_min_duration_statement = 1000
log_temp_files = 10485760
log_autovacuum_min_duration = 10000
log_line_prefix = '%m [%p] %q%u@%d/%a '
track_io_timing = on
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
