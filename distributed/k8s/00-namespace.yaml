apiVersion: v1
kind: Namespace
metadata:
  name: sunlightcity
  labels:
    app.kubernetes.io/name: sunlightcity
    app.kubernetes.io/component: simulation
---
# =============================================================================
# ResourceQuota — a guardrail, not a limit we expect to hit.
#
# The fleet is intentionally allowed to be large, but a runaway `parallelism`
# value (or a misapplied kustomize overlay) should hit a quota error rather than
# quietly consuming an entire cluster and evicting other tenants. 50 workers x
# 4 CPU / 8 Gi is the designed footprint; the quota is set at ~1.3x that to leave
# room for the orchestrator and a rolling replacement without blocking.
# =============================================================================
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sunlightcity-quota
  namespace: sunlightcity
spec:
  hard:
    requests.cpu: "220"
    requests.memory: 460Gi
    limits.cpu: "300"
    limits.memory: 560Gi
    pods: "80"
    count/jobs.batch: "20"
---
# =============================================================================
# LimitRange — every pod gets sane defaults if a manifest forgets to set them.
#
# Without this, a container with no memory request is scheduled as "best effort"
# and is the FIRST thing the kubelet kills under node pressure. For a worker
# holding a 15-minute lease that is an expensive way to discover a missing field.
# =============================================================================
apiVersion: v1
kind: LimitRange
metadata:
  name: sunlightcity-defaults
  namespace: sunlightcity
spec:
  limits:
    - type: Container
      default:              # applied as limits when unspecified
        cpu: "4"
        memory: 8Gi
      defaultRequest:       # applied as requests when unspecified
        cpu: "2"
        memory: 4Gi
      max:
        cpu: "16"
        memory: 32Gi
      min:
        cpu: 250m
        memory: 256Mi
