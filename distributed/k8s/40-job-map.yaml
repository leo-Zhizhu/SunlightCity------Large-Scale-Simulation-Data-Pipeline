# =============================================================================
# THE MAP PHASE — 54 headless Unity workers pulling from the lease queue.
#
# Depends on job/sunlit-schema having completed:
#   kubectl -n sunlightcity wait --for=condition=complete job/sunlit-schema --timeout=20m
#
# READ THIS BEFORE CHANGING parallelism/completions
# -------------------------------------------------
# This Job uses `completions` == `parallelism` with a PULL QUEUE, which is a
# deliberate and slightly unusual combination. The reasoning:
#
#   * Work is NOT bound to a pod index. Each pod loops claiming tasks until the
#     queue is dry, then exits 0. So `completions: 54` does not mean "54 tasks",
#     it means "54 workers each ran to a clean drain".
#
#   * This is the "work queue with a fixed pool" pattern. It self-balances: a pod
#     on a fast node simply completes more tasks. With an Indexed Job the assignment
#     would be static and the makespan would be set by the single worst task —
#     which here would be brutal, because a 12:00-15:00 window in June costs ~60
#     timesteps of raycasting while the same window in December costs ~1. The
#     planner measures that spread and it is 780x.
#
#   * `completions` is set (rather than left null for a pure worker-queue Job)
#     so the Job object itself reports completion, which is what a CI pipeline or
#     Argo Workflow gates the reduce phase on.
#
# To scale: change BOTH values together. Scaling parallelism alone leaves the Job
# waiting forever for completions that will never arrive.
#
# AND SCALE THE DATABASE CLUSTER WITH IT. Adding workers without adding shards
# converts a compute-bound pipeline into an I/O-bound one, which is the exact
# failure this architecture exists to avoid: 54 workers against ONE instance finish
# in 1.18 h, against nine in 11m 08.7s. `python model.py --workers-sweep` prints the
# minimum shard count for any fleet size. Past the balance point the per-shard
# admission cap in meo_claim_task simply makes the extra workers queue, so
# over-scaling is wasteful rather than harmful.
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: sunlit-map
  namespace: sunlightcity
  labels:
    app.kubernetes.io/name: sunlightcity
    app.kubernetes.io/component: map-worker
spec:
  parallelism: 54
  completions: 54

  # A pod that fails is retried, but the LEASE is what actually protects the work:
  # a dead pod's task returns to the queue after lease expiry regardless of whether
  # Kubernetes replaces the pod. backoffLimit therefore guards against a
  # systematically broken image (bad config, missing StreamingAssets), not against
  # transient task failures — those are handled by meo_tasks.max_attempts.
  #
  # 6 per-index retries: generous enough to ride out node churn and spot
  # reclamation, tight enough that a genuinely broken image fails the Job in
  # minutes rather than retrying forever.
  backoffLimit: 6

  # Hard ceiling on the whole phase. Without this a wedged run holds cluster
  # capacity indefinitely. 2 h is ~35x the expected 8m 53s of map work.
  activeDeadlineSeconds: 7200

  # Keep finished pods for 1 h so logs are retrievable, then let the TTL
  # controller clean up. Without this, 54 Completed pods accumulate per run.
  ttlSecondsAfterFinished: 3600

  # Pod failures are counted per index rather than globally in newer APIs; this
  # keeps behaviour predictable across versions.
  completionMode: NonIndexed

  template:
    metadata:
      labels:
        app.kubernetes.io/name: sunlightcity
        app.kubernetes.io/component: map-worker
      annotations:
        # Prevent the cluster autoscaler from evicting a worker mid-task to
        # consolidate nodes. The lease would recover it, but re-doing ~3 minutes of
        # raycasting for a bin-packing win is a bad trade.
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      # Never restart in place: a fresh pod gets a clean lease and a clean engine.
      # Restarting the same container would reuse a worker_id whose lease may still
      # be held, which the fencing check would then reject anyway.
      restartPolicy: Never

      # Time for the worker to finish its current timestep, flush, and release its
      # lease after SIGTERM. Must exceed the flush duration or Kubernetes SIGKILLs
      # mid-COPY and the task waits out its full lease instead.
      terminationGracePeriodSeconds: 60

      # ---- Security -------------------------------------------------------
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      # ---- Scheduling -----------------------------------------------------
      # Spread workers across nodes. Not for availability (this is a batch job) but
      # for THROUGHPUT, and it matters more now than it did with v1's single-threaded
      # loop: each worker fans a timestep's rays across seven job-system threads, so
      # two co-located pods contend for memory bandwidth and last-level cache across
      # sixteen busy threads. BVH traversal is bandwidth-bound before it is
      # compute-bound, so that contention comes straight off the raycast rate.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway   # throughput hint, not a hard requirement
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: map-worker

      # Uncomment to place the fleet on spot/preemptible nodes. The lease-based
      # recovery model makes this workload an unusually good fit for spot: a
      # reclaimed task costs at most one task's work, and the entrypoint releases
      # the lease on SIGTERM so recovery is immediate rather than lease-timeout bound.
      #
      # nodeSelector:
      #   cloud.google.com/gke-spot: "true"
      # tolerations:
      #   - key: cloud.google.com/gke-spot
      #     operator: Equal
      #     value: "true"
      #     effect: NoSchedule

      containers:
        - name: worker
          image: sunlightcity/worker:v2
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: sunlit-worker-config
            - secretRef:
                name: sunlit-db-credentials

          env:
            # Which run's tasks to claim. Overridden per invocation — the
            # orchestrator patches this, or kustomize sets it per overlay.
            - name: SUNLIT_RUN_ID
              value: "run-2026-annual"

            # Pod name as worker id: already unique, and it makes a leased task
            # traceable straight to a pod's logs. Far more useful than a random
            # GUID when debugging a stuck shard.
            - name: SUNLIT_WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            # Surfaced for log correlation.
            - name: SUNLIT_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          resources:
            requests:
              # 8 WHOLE cores, and both parts of that matter.
              #
              # Eight because the raycast loop is no longer single-threaded:
              # RaycastCommand.ScheduleBatch fans a timestep's rays across the job
              # system's worker threads, so cores now genuinely convert into
              # throughput (3.0x on 8 vCPU — short of 8x because the main thread still
              # builds the command array and folds results, and because BVH traversal
              # saturates memory bandwidth first).
              #
              # WHOLE because Unity sizes the job worker pool from the visible core
              # count, which inside a container is the cgroup quota. A fractional
              # request like 3500m would collapse the pool and silently forfeit most
              # of the per-worker speedup — with no error and no obvious symptom
              # beyond "the fleet is slower than the model says".
              cpu: "8"
              # The whole city mesh + BVH dominates, and the worker holds all of it —
              # which is what makes seam correctness automatic rather than something
              # the sharding has to enforce. Everything else is fixed at boot: the
              # sampler's persistent buffers are ~2.6 MB and the writer's payload
              # ~123 KB, both sized from SUNLIT_MAX_SECTION_SAMPLES and reused for
              # the pod's life. Memory is therefore constant in run length, not
              # merely bounded.
              memory: 16Gi
              ephemeral-storage: 2Gi
            limits:
              # No CPU limit. A quota would throttle exactly the burst the fleet is
              # waiting on, and topologySpreadConstraints already keeps the pods from
              # oversubscribing a node.
              # Memory at only 1.5x the request: the steady state is allocation-free
              # (SectionExposureSampler asserts it per window), so a worker that grows
              # past this has a leak and OOMKilling it is the correct response — the
              # lease returns its task and a fresh pod picks it up. A generous limit
              # would instead let one pod slowly consume the node and destabilise its
              # neighbours.
              memory: 24Gi
              ephemeral-storage: 4Gi

          # ---- Probes ----
          #
          # NO livenessProbe, deliberately. Liveness would only prove the process
          # exists; the lease heartbeat already proves it is making PROGRESS, which
          # is strictly stronger. Adding a liveness probe here would introduce a
          # second, weaker failure detector that can only produce false positives
          # (killing a healthy worker in a long GC pause).
          #
          # A startupProbe IS useful: it distinguishes "still booting the engine and
          # loading the mesh" from "hung", so the Job's failure accounting is honest.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                # The player writes this once the queue connection is verified.
                - "test -f /tmp/sunlit-ready"
            initialDelaySeconds: 10
            periodSeconds: 5
            # 5 min to boot: engine start + mesh load + BVH build on a cold page
            # cache, plus fetching the section->shard routing map from the coordinator
            # and allocating the persistent buffers. The marker is written only after
            # all of that, so the probe distinguishes "still booting" from "hung".
            failureThreshold: 60
            timeoutSeconds: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            # readOnlyRootFilesystem means Unity needs explicit writable scratch.
            # emptyDir (node-local) rather than a PVC: this is throwaway per-pod
            # state, and a PVC would add a provisioning round trip to every pod start.
            - name: tmp
              mountPath: /tmp
            - name: unity-home
              mountPath: /home/sunlit

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: unity-home
          emptyDir:
            sizeLimit: 1Gi
