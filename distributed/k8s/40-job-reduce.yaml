# =============================================================================
# THE REDUCE PHASE — finalise the dataset after the map fleet drains.
#
# WHY THIS IS SO SMALL COMPARED TO THE MAP PHASE
# ----------------------------------------------
# In a classic MapReduce the reduce phase is where the shuffle happens and where
# most of the cost lives. Here it is a single pod doing bookkeeping, because the
# map-side combiner already did the aggregation:
#
#   * Workers shard by EDGE, so each worker's per-(edge, timestep) sum is FINAL.
#   * There is therefore nothing to merge across workers — no shuffle, no
#     cross-worker summation, no barrier.
#   * "Reduce" degenerates to: verify completeness, build indexes, ANALYZE,
#     refresh the rollup.
#
# That is the payoff of the sharding choice. Sharding by sample point instead
# would have made this pod responsible for summing 1.58 billion partial rows.
#
# Run AFTER the map Job completes. Gate it in CI/Argo on:
#     kubectl -n sunlightcity wait --for=condition=complete job/sunlit-map --timeout=4h
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: sunlit-reduce
  namespace: sunlightcity
  labels:
    app.kubernetes.io/name: sunlightcity
    app.kubernetes.io/component: reduce
spec:
  # Exactly one: index builds and ANALYZE must not run concurrently with
  # themselves, and there is no work to parallelise here.
  parallelism: 1
  completions: 1

  # Only 2 retries. Unlike a map task, a reduce failure is almost never transient
  # — it usually means the map phase left gaps, which retrying cannot fix. Failing
  # fast surfaces the real problem instead of burning an hour re-running index builds.
  backoffLimit: 2

  # Index building over a populated dataset is genuinely slow; 6 h accommodates a
  # full raw-sample run. Combiner-only runs finish in minutes.
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 86400   # keep a day: this pod's log is the run's report

  template:
    metadata:
      labels:
        app.kubernetes.io/name: sunlightcity
        app.kubernetes.io/component: reduce
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: reduce
          # Plain Python + psycopg2; no Unity needed. The orchestrator image is
          # tiny compared with the worker image.
          image: sunlightcity/orchestrator:v1
          imagePullPolicy: IfNotPresent

          command: ["python", "-u", "/app/reduce_finalize.py"]
          # -u: unbuffered stdout, so `kubectl logs -f` shows progress live rather
          # than in 8 KB bursts. Essential for a job that runs for an hour.

          args:
            - --run-id=$(SUNLIT_RUN_ID)
            - --build-indexes
            - --refresh-rollups
            - --verify

          env:
            - name: SUNLIT_RUN_ID
              value: "run-2026-annual"

            # Connects DIRECTLY to PostgreSQL, bypassing PgBouncer. Deliberate:
            # CREATE INDEX and ANALYZE are long-running, session-affine operations,
            # and a transaction-mode pooler is the wrong tool for them. It would
            # also pin a pooled backend for the entire build, starving the pool.
            - name: SUNLIT_DB_HOST
              value: "postgres"
            - name: SUNLIT_DB_PORT
              value: "5432"

          envFrom:
            - configMapRef:
                name: sunlit-worker-config
            - secretRef:
                name: sunlit-db-credentials

          resources:
            requests:
              cpu: "1"
              # Modest: the heavy lifting happens inside PostgreSQL, not in this
              # pod. maintenance_work_mem on the SERVER is what governs index-build
              # speed — see postgresql.bulk.conf.
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
# =============================================================================
# LEASE REAPER — the failure-recovery daemon.
#
# Runs every minute for the duration of a run. Its entire job is to call
# meo_reap_expired_leases(), which returns tasks whose workers stopped
# heartbeating back to the pending pool.
#
# WHY A CRONJOB AND NOT A CONTROLLER
# ----------------------------------
# The reaping logic is one SQL function call. A custom controller watching pod
# lifecycle events would be more code, more RBAC, and STRICTLY WORSE at the job:
# pod-death events do not cover network partitions, frozen kernels, or a container
# that is running but wedged. Lease expiry covers all of them uniformly, because
# it observes the only thing that matters — whether progress is being reported.
#
# Also drops orphaned staging tables left by workers killed between
# CREATE and promote.
# =============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sunlit-lease-reaper
  namespace: sunlightcity
  labels:
    app.kubernetes.io/name: sunlightcity
    app.kubernetes.io/component: reaper
spec:
  schedule: "* * * * *"          # every minute

  # Forbid overlap: two concurrent reapers would race on the same rows. Harmless
  # (the UPDATE is atomic) but pointless, and it muddies the logs.
  concurrencyPolicy: Forbid

  # If the cluster was busy and we missed the window, do not run a backlog —
  # reaping is idempotent and the next tick handles everything.
  startingDeadlineSeconds: 30

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 300
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10002
            runAsGroup: 10002
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reaper
              image: sunlightcity/orchestrator:v1
              command: ["python", "-u", "/app/monitor.py"]
              args:
                - --run-id=$(SUNLIT_RUN_ID)
                - --reap
                - --drop-orphan-staging
                - --once
              env:
                - name: SUNLIT_RUN_ID
                  value: "run-2026-annual"
                - name: SUNLIT_DB_HOST
                  value: "postgres"
                - name: SUNLIT_DB_PORT
                  value: "5432"
              envFrom:
                - configMapRef:
                    name: sunlit-worker-config
                - secretRef:
                    name: sunlit-db-credentials
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              # readOnlyRootFilesystem needs somewhere writable: CPython and
              # psycopg2 both touch /tmp (bytecode cache, libpq scratch). Without
              # this the reaper fails on an unhelpful permission error.
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
