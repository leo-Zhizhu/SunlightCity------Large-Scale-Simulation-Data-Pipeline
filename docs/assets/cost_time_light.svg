<rect x="706.0" y="90.0" width="152.0" height="150.0" rx="6" fill="#f4f4f1"/>
<text x="718.0" y="112.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="600" fill="#52514e" text-anchor="start" style="font-variant-numeric:tabular-nums">asymptote</text>
<text x="718.0" y="134.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#0b0b0b" text-anchor="start" style="font-variant-numeric:tabular-nums">75 s</text>
<text x="718.0" y="156.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">spin-up + ANALYZE.</text>
<text x="718.0" y="168.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">Neither shrinks with</text>
<text x="718.0" y="180.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">hardware, so no budget</text>
<text x="718.0" y="192.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">beats it.</text>
<text x="718.0" y="204.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums"></text>
<text x="718.0" y="216.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">Past ~1060 vCPU an extra</text>
<text x="718.0" y="228.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">100 buys less than the</text>
<text x="718.0" y="240.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">30 s floor itself.</text>
<rect x="40.0" y="369.0" width="800.0" height="73.0" rx="6" fill="#f4f4f1"/>
<text x="56.0" y="394.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start" style="font-variant-numeric:tabular-nums">The frontier is a STAIRCASE: workers climb at a fixed shard count until the shape goes I/O-bound, then a shard is added and workers</text>
<text x="56.0" y="409.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">resume. Every tread is compute-bound, which is the cluster doing its job. Marginal return halves roughly every +200 vCPU with no</text>
<text x="56.0" y="424.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">inflection anywhere — so 'diminishing returns' cannot pick a point on this curve, and did not. The deadline did.</text>
</svg>