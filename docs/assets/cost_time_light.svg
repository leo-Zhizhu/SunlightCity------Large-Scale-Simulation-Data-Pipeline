<text x="303.4" y="291.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="8.5" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric:tabular-nums">per +100 vCPU</text>
