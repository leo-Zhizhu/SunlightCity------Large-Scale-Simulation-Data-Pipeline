<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-label="The same 400 m street at the same instant, walked in opposite directions. Walking with the moving shadow gives 504 seconds of sun and a 252 m continuous exposure; walking against it gives 492 seconds and 246 m. A per-edge sum cannot tell the two apart.">
