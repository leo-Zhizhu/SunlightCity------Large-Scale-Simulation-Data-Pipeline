<rect x="40.0" y="296.0" width="780.0" height="42.0" rx="6" fill="#f4f4f1"/>
<text x="56.0" y="314.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#0b0b0b" text-anchor="start" style="font-variant-numeric:tabular-nums">Both directions cross the SAME set of sample points and the same total sunlit count. A per-edge sunlit_sum is identical for the two.</text>
<text x="56.0" y="330.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">The 12-second difference and the 6 m difference in continuous exposure exist only in the ordered, per-sample series.</text>
<text x="40.0" y="366.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start" style="font-variant-numeric:tabular-nums">This is why v2 keeps v1's 1,577,374,560 rows instead of collapsing them to 28,944,000 per-edge sums —</text>
<text x="40.0" y="382.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start" style="font-variant-numeric:tabular-nums">and therefore why it needs 10 database instances rather than one.</text>
</svg>