<text x="134.0" y="132.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="end" style="font-variant-numeric:tabular-nums">worker-a7f3</text>
<text x="134.0" y="146.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">pod on spot node</text>
