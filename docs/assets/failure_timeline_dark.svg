<text x="134.0" y="204.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">meo_tasks row</text>
<line x1="150.0" y1="196.0" x2="800.0" y2="196.0" stroke="#383835" stroke-width="1" stroke-linecap="butt"/>
