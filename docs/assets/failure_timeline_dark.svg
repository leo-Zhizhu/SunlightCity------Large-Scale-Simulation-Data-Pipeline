<text x="134.0" y="262.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">picks up the task</text>
<line x1="150.0" y1="254.0" x2="800.0" y2="254.0" stroke="#383835" stroke-width="1" stroke-linecap="butt"/>
<rect x="150.0" y="128.0" width="236.4" height="20.0" rx="4" fill="#5598e7"/>
<text x="268.2" y="142.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="600" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">raycasting</text>
<line x1="179.5" y1="130.0" x2="179.5" y2="146.0" stroke="#1a1a19" stroke-width="1" stroke-linecap="butt" opacity="0.5"/>
<line x1="209.1" y1="130.0" x2="209.1" y2="146.0" stroke="#1a1a19" stroke-width="1" stroke-linecap="butt" opacity="0.5"/>
<line x1="238.6" y1="130.0" x2="238.6" y2="146.0" stroke="#1a1a19" stroke-width="1" stroke-linecap="butt" opacity="0.5"/>
<line x1="268.2" y1="130.0" x2="268.2" y2="146.0" stroke="#1a1a19" stroke-width="1" stroke-linecap="butt" opacity="0.5"/>
<line x1="297.7" y1="130.0" x2="297.7" y2="146.0" stroke="#1a1a19" stroke-width="1" stroke-linecap="butt" opacity="0.5"/>
<line x1="327.3" y1="130.0" x2="327.3" y2="146.0" stroke="#1a1a19" stroke-width="1" stroke-linecap="butt" opacity="0.5"/>
<line x1="356.8" y1="130.0" x2="356.8" y2="146.0" stroke="#1a1a19" stroke-width="1" stroke-linecap="butt" opacity="0.5"/>
<text x="150.0" y="118.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">│ = heartbeat (30 s)</text>
<line x1="386.4" y1="114.0" x2="386.4" y2="156.0" stroke="#e66767" stroke-width="2" stroke-linecap="butt"/>
<text x="394.4" y="124.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="700" fill="#e66767" text-anchor="start" style="font-variant-numeric:tabular-nums">SIGKILL</text>
<text x="394.4" y="138.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">spot reclaim / OOM / node loss</text>
<rect x="150.0" y="186.0" width="236.4" height="20.0" rx="4" fill="#1c5cab"/>
