<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" role="img" aria-label="Timeline showing a worker killed mid-task. Its lease stops being renewed, expires, and the reaper returns the task to the queue where another worker claims and completes it. No coordinator is involved.">
<rect width="860" height="340" fill="#1a1a19"/>
<text x="40.0" y="34.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="start" style="font-variant-numeric:tabular-nums">How a dead worker recovers</text>
<text x="40.0" y="55.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">An unrenewed lease IS the failure signal — no controller, no pod watch, no liveness probe.</text>
<text x="820.0" y="34.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">ILLUSTRATIVE</text>
