<rect x="534.1" y="186.0" width="21.7" height="20.0" rx="3" fill="#f0803c"/>
<text x="561.8" y="200.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#f0803c" text-anchor="start" style="font-variant-numeric:tabular-nums">back to pending</text>
<rect x="567.6" y="244.0" width="222.6" height="20.0" rx="4" fill="#5598e7"/>
<text x="678.9" y="258.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="600" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">re-claims · redoes · completes</text>
<circle cx="796.1" cy="254.0" r="5.5" fill="#0ca30c"/>
<line x1="386.4" y1="292.0" x2="563.6" y2="292.0" stroke="#f0803c" stroke-width="1.5" stroke-linecap="butt"/>
<line x1="386.4" y1="288.0" x2="386.4" y2="296.0" stroke="#f0803c" stroke-width="1.5" stroke-linecap="butt"/>
<line x1="563.6" y1="288.0" x2="563.6" y2="296.0" stroke="#f0803c" stroke-width="1.5" stroke-linecap="butt"/>
<text x="475.0" y="284.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="600" fill="#f0803c" text-anchor="middle" style="font-variant-numeric:tabular-nums">recovery window = lease TTL</text>
<text x="475.0" y="308.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric:tabular-nums">on graceful SIGTERM the lease is released immediately instead</text>
</svg>