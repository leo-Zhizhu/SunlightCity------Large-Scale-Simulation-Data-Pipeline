<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-label="Wall clock against database shard count at a fixed 50 workers. One instance takes 15m 12s; ten take 3m 20s. Below eight shards the fleet is I/O-bound and waiting on the database.">
<rect width="860" height="400" fill="#1a1a19"/>
<text x="40.0" y="34.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="start" style="font-variant-numeric:tabular-nums">The bottleneck was never the raycasting</text>
<text x="40.0" y="55.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">Same 50 workers, same code. Only the number of PostgreSQL instances changes.</text>
<text x="820.0" y="34.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">MODELLED</text>
<line x1="78.0" y1="304.0" x2="690.0" y2="304.0" stroke="#2c2c2a" stroke-width="1" stroke-linecap="butt"/>
<text x="68.0" y="308.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">0m</text>
<line x1="78.0" y1="263.8" x2="690.0" y2="263.8" stroke="#2c2c2a" stroke-width="1" stroke-linecap="butt"/>
<text x="68.0" y="267.8" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">3m</text>
<line x1="78.0" y1="223.6" x2="690.0" y2="223.6" stroke="#2c2c2a" stroke-width="1" stroke-linecap="butt"/>
<text x="68.0" y="227.6" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">6m</text>
<line x1="78.0" y1="183.3" x2="690.0" y2="183.3" stroke="#2c2c2a" stroke-width="1" stroke-linecap="butt"/>
<text x="68.0" y="187.3" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">9m</text>
<line x1="78.0" y1="143.1" x2="690.0" y2="143.1" stroke="#2c2c2a" stroke-width="1" stroke-linecap="butt"/>
<text x="68.0" y="147.1" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">12m</text>
<line x1="78.0" y1="102.9" x2="690.0" y2="102.9" stroke="#2c2c2a" stroke-width="1" stroke-linecap="butt"/>
<text x="68.0" y="106.9" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">15m</text>
<text x="78.0" y="322.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric:tabular-nums">1</text>
<text x="206.8" y="322.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric:tabular-nums">5</text>
<text x="367.9" y="322.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric:tabular-nums">10</text>
<text x="528.9" y="322.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric:tabular-nums">15</text>
<text x="690.0" y="322.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric:tabular-nums">20</text>
<text x="384.0" y="342.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="400" fill="#c3c2b7" text-anchor="middle" style="font-variant-numeric:tabular-nums">database shards</text>
<rect x="78.0" y="88.0" width="193.3" height="216.0" rx="0" fill="#e66767" opacity="0.07"/>
<text x="174.6" y="243.5" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="700" fill="#e66767" text-anchor="middle" style="font-variant-numeric:tabular-nums">I/O-bound</text>
<text x="174.6" y="258.5" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric:tabular-nums">fleet waits on the DB</text>
<path d="M 78.0 100.2 L 110.2 193.7 L 142.4 224.9 L 174.6 240.5 L 206.8 249.8 L 239.1 256.1 L 271.3 257.7 L 303.5 258.4 L 335.7 258.9 L 367.9 259.4 L 400.1 259.8 L 432.3 260.1 L 464.5 260.3 L 496.7 260.5 L 528.9 260.7 L 561.2 260.9 L 593.4 259.0 L 625.6 260.5 L 657.8 261.3 L 690.0 261.4" fill="none" stroke="#5598e7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="78.0" cy="100.2" r="5" fill="#6b6a66" stroke="#1a1a19" stroke-width="2"/>
<text x="90.0" y="94.2" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="start" style="font-variant-numeric:tabular-nums">1 shard — 15m 12s</text>
<text x="90.0" y="108.2" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">24x vs v1</text>
<circle cx="367.9" cy="259.4" r="5" fill="#5598e7" stroke="#1a1a19" stroke-width="2"/>
<text x="379.9" y="253.4" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="start" style="font-variant-numeric:tabular-nums">10 shards — 3m 20s</text>
<text x="379.9" y="267.4" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">108x vs v1</text>
<line x1="367.9" y1="88.0" x2="367.9" y2="304.0" stroke="#f0803c" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="4 3"/>
<text x="367.9" y="82.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#f0803c" text-anchor="middle" style="font-variant-numeric:tabular-nums">deployed</text>
<rect x="712.0" y="88.0" width="128.0" height="96.0" rx="6" fill="#242422"/>
<text x="724.0" y="110.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#5598e7" text-anchor="start" style="font-variant-numeric:tabular-nums">4.6x</text>
<text x="724.0" y="128.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric:tabular-nums">from the cluster</text>
<text x="724.0" y="148.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">of the 108x total</text>
<text x="724.0" y="164.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">the other 4.1x</text>
<text x="724.0" y="176.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">is per-worker</text>
<rect x="40.0" y="326.0" width="780.0" height="56.0" rx="6" fill="#242422"/>
<text x="56.0" y="346.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric:tabular-nums">One instance absorbs ~2.4M rows/s (12 COPY streams on 16 vCPU, one busy CPU each). The fleet produces 14.8M/s.</text>
<text x="56.0" y="364.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">So the cluster needs at least 7. Ten are deployed — +35% headroom, so a checkpoint or a vacuum on one instance cannot stall the fleet.</text>
</svg>