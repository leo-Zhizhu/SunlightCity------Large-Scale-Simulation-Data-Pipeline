<svg xmlns="http://www.w3.org/2000/svg" width="880" height="436" viewBox="0 0 880 436" role="img" aria-label="Wall clock against database shard count at a fixed 54 workers. One instance takes 1.2 h; the deployed 9 take 11m 09s. Below 7 shards the fleet is I/O-bound and waiting on the database.">
<rect width="880" height="436" fill="#1a1a19"/>
<text x="40.0" y="34.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="start" style="font-variant-numeric:tabular-nums">The bottleneck was never the raycasting</text>
<text x="40.0" y="55.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">Same 54 workers, same code. Only the number of PostgreSQL instances changes.</text>
<text x="840.0" y="34.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">MODELLED</text>
<line x1="86.0" y1="320.0" x2="694.0" y2="320.0" stroke="#2c2c2a" stroke-width="1" stroke-linecap="butt"/>
<text x="76.0" y="324.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">0m</text>
<line x1="86.0" y1="290.2" x2="694.0" y2="290.2" stroke="#2c2c2a" stroke-width="1" stroke-linecap="butt"/>
<text x="76.0" y="294.2" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">10m</text>
<line x1="86.0" y1="260.5" x2="694.0" y2="260.5" stroke="#2c2c2a" stroke-width="1" stroke-linecap="butt"/>
<text x="76.0" y="264.5" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">20m</text>
<line x1="86.0" y1="230.7" x2="694.0" y2="230.7" stroke="#2c2c2a" stroke-width="1" stroke-linecap="butt"/>
<text x="76.0" y="234.7" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">30m</text>
<line x1="86.0" y1="200.9" x2="694.0" y2="200.9" stroke="#2c2c2a" stroke-width="1" stroke-linecap="butt"/>
<text x="76.0" y="204.9" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">40m</text>
<line x1="86.0" y1="171.2" x2="694.0" y2="171.2" stroke="#2c2c2a" stroke-width="1" stroke-linecap="butt"/>
<text x="76.0" y="175.2" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">50m</text>
<line x1="86.0" y1="141.4" x2="694.0" y2="141.4" stroke="#2c2c2a" stroke-width="1" stroke-linecap="butt"/>
<text x="76.0" y="145.4" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">60m</text>
<line x1="86.0" y1="111.6" x2="694.0" y2="111.6" stroke="#2c2c2a" stroke-width="1" stroke-linecap="butt"/>
<text x="76.0" y="115.6" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">70m</text>
<text x="0" y="0" transform="translate(34.0,208.0) rotate(-90)" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="400" fill="#c3c2b7" text-anchor="middle">wall clock</text>
<text x="86.0" y="338.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric:tabular-nums">1</text>
<text x="214.0" y="338.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric:tabular-nums">5</text>
<text x="374.0" y="338.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric:tabular-nums">10</text>
<text x="534.0" y="338.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric:tabular-nums">15</text>
<text x="694.0" y="338.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric:tabular-nums">20</text>
<text x="390.0" y="358.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="400" fill="#c3c2b7" text-anchor="middle" style="font-variant-numeric:tabular-nums">database shards</text>
<rect x="86.0" y="96.0" width="192.0" height="224.0" rx="0" fill="#e66767" opacity="0.07"/>
<text x="205.0" y="163.2" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10.5" font-weight="700" fill="#e66767" text-anchor="middle" style="font-variant-numeric:tabular-nums">I/O-bound</text>
<text x="205.0" y="178.2" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#898781" text-anchor="middle" style="font-variant-numeric:tabular-nums">fleet waits on the DB</text>
<path d="M 86.0 108.7 L 118.0 212.5 L 150.0 247.1 L 182.0 264.4 L 214.0 274.8 L 246.0 281.7 L 278.0 285.4 L 310.0 286.2 L 342.0 286.8 L 374.0 287.3 L 406.0 287.7 L 438.0 288.1 L 470.0 288.4 L 502.0 288.6 L 534.0 288.8 L 566.0 289.0 L 598.0 289.2 L 630.0 289.3 L 662.0 288.2 L 694.0 289.6" fill="none" stroke="#5598e7" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="342.0" y1="96.0" x2="342.0" y2="320.0" stroke="#f0803c" stroke-width="1.5" stroke-linecap="butt" stroke-dasharray="4 3"/>
<text x="342.0" y="88.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#f0803c" text-anchor="middle" style="font-variant-numeric:tabular-nums">deployed</text>
<circle cx="86.0" cy="108.7" r="5" fill="#6b6a66" stroke="#1a1a19" stroke-width="2"/>
<text x="100.0" y="112.7" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="start" style="font-variant-numeric:tabular-nums">1 shard — 1.2 h</text>
<circle cx="342.0" cy="286.8" r="5.5" fill="#5598e7" stroke="#1a1a19" stroke-width="2"/>
<text x="353.0" y="274.8" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="start" style="font-variant-numeric:tabular-nums">9 shards — 11m 09s</text>
<rect x="724.0" y="96.0" width="150.0" height="176.0" rx="6" fill="#242422"/>
<text x="738.0" y="126.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="24" font-weight="700" fill="#5598e7" text-anchor="start" style="font-variant-numeric:tabular-nums">6.4x</text>
<text x="738.0" y="144.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric:tabular-nums">from the cluster</text>
<text x="738.0" y="168.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="600" fill="#ffffff" text-anchor="start" style="font-variant-numeric:tabular-nums">of the 161.5x total</text>
<text x="738.0" y="184.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="8.6" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">work-normalised:</text>
<text x="738.0" y="196.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="8.6" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">v1 needs 30.0 h</text>
<text x="738.0" y="208.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="8.6" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">for the same 60 dates</text>
<text x="738.0" y="244.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric:tabular-nums">1 shard is 25.4x</text>
<text x="738.0" y="258.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">the other 4.1x per pod</text>
<rect x="40.0" y="345.0" width="800.0" height="73.0" rx="6" fill="#242422"/>
<text x="56.0" y="370.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric:tabular-nums">One instance absorbs ~2.4M rows/s (12 COPY streams on 16 vCPU, one busy CPU each), while the fleet produces 16.0M rows/s. So the cluster</text>
<text x="56.0" y="385.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">needs at least 7 to keep up at all. 9 are deployed — +35% headroom, so a checkpoint, a vacuum, or losing an instance outright cannot stall</text>
<text x="56.0" y="400.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">the fleet.</text>
</svg>