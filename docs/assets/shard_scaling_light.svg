<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-label="Wall clock against database shard count at a fixed 50 workers. One instance takes 1.2 h; ten take 11m 38s. Below eight shards the fleet is I/O-bound and waiting on the database.">
