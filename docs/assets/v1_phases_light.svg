<text x="144.0" y="123.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="start" style="font-variant-numeric:tabular-nums">OSM buildings + terrain · ~1 GB Unity project</text>
<text x="572.0" y="102.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">No road network in it. The street surface is the</text>
