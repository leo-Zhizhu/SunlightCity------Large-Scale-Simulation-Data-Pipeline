<svg xmlns="http://www.w3.org/2000/svg" width="860" height="733" viewBox="0 0 860 733" role="img" aria-label="v1's six phases as a ladder: the city mesh becomes a road graph, the graph becomes PostGIS geometry and 365,133 sample points, a year of solar positions and the static tree shade are precomputed, and only the last transition — 6 h 00 min of sweeping and raycasting — produces the 1,577,374,560 sample rows. Every earlier step runs once.">
<rect width="860" height="733" fill="#fcfcfb"/>
<text x="40.0" y="34.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="600" fill="#0b0b0b" text-anchor="start" style="font-variant-numeric:tabular-nums">The six phases, and which one costs six hours</text>
<text x="40.0" y="55.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">Boxes are artifacts. Arrows are the phases that produce them, labelled with the tool that runs and what it costs.</text>
<text x="820.0" y="34.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">V1_PIPELINE.md</text>
