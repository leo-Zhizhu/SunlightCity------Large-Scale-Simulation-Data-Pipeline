<text x="572.0" y="597.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">110 GB with two indexes maintained inline. 990,240,696</text>
<text x="572.0" y="608.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">raycasts at 73,027 rows/s on one thread. Peak RAM ~250</text>
<text x="572.0" y="619.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">MB, flat.</text>
<rect x="40.0" y="659.0" width="780.0" height="74.0" rx="6" fill="#f4f4f1"/>
<text x="56.0" y="679.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#52514e" text-anchor="start" style="font-variant-numeric:tabular-nums">Four of the five phases run once and are measured in minutes. The fifth is the simulation: 990,240,696 raycasts against the city's</text>
<text x="56.0" y="695.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">BVH, 6 h 00 min on one thread. v2 changes only that last arrow — same inputs, same schema, same rows, on 54 workers and 9 database</text>
<text x="56.0" y="711.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">instances instead of one desktop.</text>
