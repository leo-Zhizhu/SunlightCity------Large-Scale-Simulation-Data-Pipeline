<text x="144.0" y="618.0" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="9.5" font-weight="400" fill="#52514e" text-anchor="start" style="font-variant-numeric:tabular-nums">meo_exposure_edges — 28,944,000 rows · derived</text>
<rect x="460.0" y="589.0" width="78.0" height="15.0" rx="7.5" fill="#c2410c"/>
