<text x="758.0" y="112.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="600" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric:tabular-nums">deployed</text>
<text x="758.0" y="132.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#f0803c" text-anchor="start" style="font-variant-numeric:tabular-nums">54 / 9</text>
<text x="758.0" y="150.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#ffffff" text-anchor="start" style="font-variant-numeric:tabular-nums">11m 09s</text>
<text x="758.0" y="170.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">red dots mark</text>
<text x="758.0" y="182.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">where each curve</text>
<text x="758.0" y="194.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">goes I/O-bound</text>
<rect x="40.0" y="364.0" width="800.0" height="88.0" rx="6" fill="#242422"/>
<text x="56.0" y="389.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric:tabular-nums">Four shards cannot meet the deadline with ANY fleet — that curve flattens at 18m 41s, above the line, and stays there. (Two shards is off</text>
<text x="56.0" y="404.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">the top of this axis entirely, at 36m 07s.) This is why the answer to 'it is too slow' is not always 'add nodes': past the ceiling every</text>
<text x="56.0" y="419.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">extra pod raycasts into a queue. The 9-shard curve is still bending at 54 workers, which is what it means for the pipeline to be</text>
<text x="56.0" y="434.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">compute-bound — and why the fleet was sized to sit there.</text>
</svg>