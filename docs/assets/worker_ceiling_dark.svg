<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" role="img" aria-label="Wall clock against fleet size for several shard counts. Each curve flattens at its database ingest ceiling, so adding workers past that point buys nothing.">
<rect width="880" height="470" fill="#1a1a19"/>
<text x="40.0" y="34.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="start" style="font-variant-numeric:tabular-nums">Adding nodes stops helping, and the database decides when</text>
