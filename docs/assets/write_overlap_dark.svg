<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-label="Why the map phase costs max rather than sum. Sequentially a task would cost 1.53 s — 0.88 s of ray casting plus 0.65 s of writing — and 43% of the fleet's life would be socket time. With the write handed to a second thread on a second connection, three tasks fit in the time two would have taken.">
<rect width="880" height="430" fill="#1a1a19"/>
<text x="40.0" y="34.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="600" fill="#ffffff" text-anchor="start" style="font-variant-numeric:tabular-nums">Why writing is free</text>
<text x="40.0" y="55.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">Same work, same rates. The only change is that the flush runs on its own thread and its own connection.</text>
<text x="840.0" y="34.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#898781" text-anchor="end" style="font-variant-numeric:tabular-nums">MEASURED · per task</text>
<text x="40.0" y="88.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="700" fill="#e66767" text-anchor="start" style="font-variant-numeric:tabular-nums">SEQUENTIAL — one connection</text>
<text x="40.0" y="120.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric:tabular-nums">one thread</text>
<rect x="132.0" y="100.0" width="111.1" height="26.0" rx="4" fill="#5598e7" opacity="0.85"/>
<text x="187.6" y="117.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">ray 0</text>
<rect x="243.1" y="100.0" width="82.2" height="26.0" rx="4" fill="#f0803c" opacity="0.85"/>
<text x="284.2" y="117.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">COPY</text>
<rect x="325.3" y="100.0" width="111.1" height="26.0" rx="4" fill="#5598e7" opacity="0.85"/>
<text x="380.9" y="117.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">ray 1</text>
<rect x="436.5" y="100.0" width="82.2" height="26.0" rx="4" fill="#f0803c" opacity="0.85"/>
<text x="477.6" y="117.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">COPY</text>
<rect x="518.7" y="100.0" width="111.1" height="26.0" rx="4" fill="#5598e7" opacity="0.85"/>
<text x="574.2" y="117.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">ray 2</text>
<rect x="629.8" y="100.0" width="82.2" height="26.0" rx="4" fill="#f0803c" opacity="0.85"/>
<text x="670.9" y="117.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">COPY</text>
<line x1="132.0" y1="140.0" x2="712.0" y2="140.0" stroke="#e66767" stroke-width="1.5" stroke-linecap="butt"/>
<text x="422.0" y="155.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="700" fill="#e66767" text-anchor="middle" style="font-variant-numeric:tabular-nums">3 tasks in 4.60 s  ·  43% of it socket time</text>
<text x="40.0" y="200.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="700" fill="#0ca30c" text-anchor="start" style="font-variant-numeric:tabular-nums">OVERLAPPED — 2 connections</text>
<text x="40.0" y="232.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric:tabular-nums">main thread</text>
<text x="40.0" y="264.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric:tabular-nums">writer thread</text>
<rect x="132.0" y="212.0" width="111.1" height="26.0" rx="4" fill="#5598e7" opacity="1.0"/>
<text x="187.6" y="229.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">ray 0</text>
<rect x="243.1" y="212.0" width="111.1" height="26.0" rx="4" fill="#5598e7" opacity="1.0"/>
<text x="298.7" y="229.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">ray 1</text>
<rect x="354.3" y="212.0" width="111.1" height="26.0" rx="4" fill="#5598e7" opacity="1.0"/>
<text x="409.9" y="229.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">ray 2</text>
<rect x="465.4" y="212.0" width="111.1" height="26.0" rx="4" fill="#5598e7" opacity="1.0"/>
<text x="521.0" y="229.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">ray 3</text>
<rect x="243.1" y="244.0" width="82.2" height="26.0" rx="4" fill="#f0803c" opacity="1.0"/>
<text x="284.2" y="261.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">COPY 0</text>
<rect x="354.3" y="244.0" width="82.2" height="26.0" rx="4" fill="#f0803c" opacity="1.0"/>
<text x="395.4" y="261.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">COPY 1</text>
<rect x="465.4" y="244.0" width="82.2" height="26.0" rx="4" fill="#f0803c" opacity="1.0"/>
<text x="506.5" y="261.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9.5" font-weight="600" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">COPY 2</text>
<line x1="132.0" y1="286.0" x2="576.6" y2="286.0" stroke="#0ca30c" stroke-width="1.5" stroke-linecap="butt"/>
<text x="354.3" y="301.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="10" font-weight="700" fill="#0ca30c" text-anchor="middle" style="font-variant-numeric:tabular-nums">4 tasks in 3.53 s  ·  the writer is idle 26% of the time</text>
<rect x="734.0" y="100.0" width="146.0" height="188.0" rx="6" fill="#242422"/>
<text x="746.0" y="122.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric:tabular-nums">ray cast</text>
<text x="746.0" y="136.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#5598e7" text-anchor="start" style="font-variant-numeric:tabular-nums">0.88 s</text>
<text x="746.0" y="148.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric:tabular-nums">COPY, one stream</text>
<text x="746.0" y="162.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#f0803c" text-anchor="start" style="font-variant-numeric:tabular-nums">1.30 s</text>
<text x="746.0" y="174.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric:tabular-nums">COPY, amortised</text>
<text x="746.0" y="188.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#f0803c" text-anchor="start" style="font-variant-numeric:tabular-nums">0.65 s</text>
<text x="746.0" y="226.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric:tabular-nums">sequential</text>
<text x="746.0" y="240.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#e66767" text-anchor="start" style="font-variant-numeric:tabular-nums">1.53 s</text>
<text x="746.0" y="252.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="9" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric:tabular-nums">overlapped</text>
<text x="746.0" y="266.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#0ca30c" text-anchor="start" style="font-variant-numeric:tabular-nums">0.88 s</text>
<rect x="40.0" y="324.0" width="800.0" height="88.0" rx="6" fill="#242422"/>
<text x="56.0" y="349.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start" style="font-variant-numeric:tabular-nums">The two figures for writing are both real and neither is a typo: one task's 261k rows take 1.30 s down a SINGLE stream — which is what a</text>
<text x="56.0" y="364.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">WROTE log line reports — but the worker alternates between 2, so the amortised cost is 0.65 s. That is comfortably inside the 0.88 s the</text>
<text x="56.0" y="379.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">main thread spends on the next task, which is what keeps the pipeline compute-bound. One connection could not do it: batch N could not be</text>
<text x="56.0" y="394.0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start" style="font-variant-numeric:tabular-nums">flushing while batch N+1 was being queued.</text>
</svg>